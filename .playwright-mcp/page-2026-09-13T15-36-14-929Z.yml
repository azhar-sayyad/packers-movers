      - generic [ref=f13e26]:
        - heading "Our Moving Services" [level=1] [ref=f13e27]
        - paragraph [ref=f13e28]: End-to-end relocation solutions tailored for homes, offices, vehicles, and storage.
      - generic [ref=f13e29]:
        - generic [ref=f13e30]:
          - heading "Choose the Right Service" [level=2] [ref=f13e31]
          - paragraph [ref=f13e32]: Every move is different. Explore our specialized relocation services below.
        - generic [ref=f13e33]:
          - link [ref=f13e34] [cursor=pointer]:
            - /url: /services/car-transportation
            - heading "Car & Bike Transportation" [level=2] [ref=f13e42]
            - paragraph [ref=f13e43]: Transport your car or motorcycle anywhere across India safely. We use specialized car carrier trucks with safety wheel chocks, tie-down straps, and protective car covers to ensure damage-free delivery.
            - list [ref=f13e44]:
              - listitem [ref=f13e45]: Enclosed Dedicated Vehicle Carriers
              - listitem [ref=f13e49]: Wheel Chocks & Heavy-Duty Tie Down Straps
              - listitem [ref=f13e53]: Pre-Transport Physical Inspection Checklist
              - listitem [ref=f13e57]: GPS Tracked Transit Vehicle
            - generic [ref=f13e61]: View service details
          - link [ref=f13e64] [cursor=pointer]:
            - /url: /services/household-shifting
            - heading "Household Shifting" [level=2] [ref=f13e70]
            - paragraph [ref=f13e71]: Our Household Shifting service handles everything from fragile kitchen glassware and heavy wooden beds to sensitive LED TVs and appliances. We use 3-layer protective wrapping including bubble wrap, corrugated sheets, and stretch film.
            - list [ref=f13e72]:
              - listitem [ref=f13e73]: 3-Layer Protective Bubble & Foam Packaging
              - listitem [ref=f13e77]: Expert Furniture Disassembly & Re-assembly
              - listitem [ref=f13e81]: Enclosed Weatherproof Container Trucks
              - listitem [ref=f13e85]: Door-to-Door Loading & Unloading
            - generic [ref=f13e89]: View service details
          - link [ref=f13e92] [cursor=pointer]:
            - /url: /services/local-relocation
            - heading "Local Relocation" [level=2] [ref=f13e98]
            - paragraph [ref=f13e99]: Moving just a few kilometers away? Our express local shifting service provides rapid same-day packing, loading, transit, and unloading at affordable hourly or flat rates.
            - list [ref=f13e100]:
              - listitem [ref=f13e101]: Same-Day Swift Relocation
              - listitem [ref=f13e105]: Dedicated Mini Trucks & Pickup Containers
              - listitem [ref=f13e109]: Affordable Fixed Local Rates
              - listitem [ref=f13e113]: Trained Local Moving Crews
            - generic [ref=f13e117]: View service details
          - link [ref=f13e120] [cursor=pointer]:
            - /url: /services/office-shifting
            - heading "Office & Commercial Relocation" [level=2] [ref=f13e127]
            - paragraph [ref=f13e128]: Minimize business interruption with our planned weekend and overnight office shifting solutions. We specialize in computer server packing, modular desk dismantling, file archiving, and office furniture transport.
            - list [ref=f13e129]:
              - listitem [ref=f13e130]: Minimal Operations Downtime Strategy
              - listitem [ref=f13e134]: Antistatic Server & IT Equipment Packing
              - listitem [ref=f13e138]: Modular Workstation Disassembly
              - listitem [ref=f13e142]: Systematic Box Tagging & Inventory Control
            - generic [ref=f13e146]: View service details
          - link [ref=f13e149] [cursor=pointer]:
            - /url: /services/packing-unpacking
            - heading "Packing & Unpacking Only" [level=2] [ref=f13e156]
            - paragraph [ref=f13e157]: Already have your own vehicle? Hire our expert packers to carefully wrap, box, label, and organize your valuable items using top-quality cardboard boxes, tape, and protective rolls.
            - list [ref=f13e158]:
              - listitem [ref=f13e159]: Premium Quality Packing Material Provided
              - listitem [ref=f13e163]: Professional Fragile Item Handling
              - listitem [ref=f13e167]: Color-Coded Box Labeling
              - listitem [ref=f13e171]: Unpacking & Furniture Placement Help
            - generic [ref=f13e175]: View service details
          - link [ref=f13e178] [cursor=pointer]:
            - /url: /services/warehousing
            - heading "Warehousing & Storage" [level=2] [ref=f13e184]
            - paragraph [ref=f13e185]: Need short-term or long-term storage while renovating or waiting for your new home key? Our modern warehouse facilities offer pest-controlled, CCTV-monitored, palletized storage with flexible monthly plans.
            - list [ref=f13e186]:
              - listitem [ref=f13e187]: 24/7 CCTV Camera Monitoring & Security
              - listitem [ref=f13e191]: Pest-Controlled & Moisture-Proof Environment
              - listitem [ref=f13e195]: Flexible Short-Term & Long-Term Leases
              - listitem [ref=f13e199]: Palletized Stacking & Sealed Wooden Crates
            - generic [ref=f13e203]: View service details
